# Auditoría técnica pre-producción — resumen estructurado
# Informe completo: docs/AUDIT-2026-07-29.md
# Modo solo lectura: no se modificó ningún fichero del proyecto.

proyecto: "Estades Delta"
fecha_auditoria: "2026-07-29"
commit_auditado: "1a5ba0d"
rama: "feat/content-rag-tenant-vector"
ficheros_sin_commitear: 25

# --- Campos específicos solicitados -----------------------------------------
plone_version: "6.1.4"          # pin exacto, backend/pyproject.toml:33
volto_version: "18.33.1"        # devops/docker-compose.dev.yml:265
zope_version: "6.1"

# ZODB vive en PostgreSQL vía RelStorage — NO hay Data.fs en disco.
# Se reportan los equivalentes reales, medidos con du -sh sobre el volumen Docker.
data_fs_mb: 0                   # NO APLICA: RelStorage, sin Data.fs de fichero
postgres_zodb_mb: 84.3          # medido: volumen estadesdelta-pg-data completo
postgres_base_mb: 51.4          # medido: /var/lib/postgresql/data/base
blobstorage_mb: 0               # NO DETERMINADO: shared-blob-dir sin fijar (relstorage.conf:28)
                                # afecta a la estrategia de backup — resolver antes de desplegar
ram_zope_mb: 167                # MEDIDO en reposo con docker stats (no estimado)
ram_zope_mb_bajo_carga_est: 450 # SOSPECHA: extrapolado
caching_configurado: true       # plone.app.caching + with-caching-proxy en metadata.xml:6-7
                                # ICacheSettings.enabled=True en registry/
                                # PERO: el proxy (Varnish/purger) NO existe en el compose desplegable
caching_efectivo: false         # matiz crítico: purga apunta a http://purger, host inexistente
datos_reales_a_anonimizar: false # sólo 3 Properties de demo (setuphandlers/demo_content.py)

# --- Estado general ---------------------------------------------------------
desplegable_hoy: false
bloqueadores_duros: 3
veredicto: >-
  El código de aplicación está por encima de la media (adapters con Protocol+Mock,
  índices de catálogo correctos, HNSW justificado, rate limiting implementado,
  IDOR bien defendido). El problema es la capa de despliegue, que no existe.
  Con las acciones 1-5 del top-10 (~2-3 días) pasa a desplegable.

# --- Inventario -------------------------------------------------------------
loc:
  backend_src: {ficheros: 46, lineas: 3947}
  backend_tests: {ficheros: 22, lineas: 1135}
  frontend_src: {ficheros: 134, lineas: 9722}

servicios: [traefik, postgres, redis, backend, frontend, worker, beat, ollama, assistant]

entrypoints:
  plone: "waitress egg:Zope#main, threads=2"        # /app/etc/zope.ini:9 (leído del contenedor)
  worker: "celery worker -Q messaging,scheduled,embeddings"  # sin --concurrency
  beat: "celery beat"
  assistant: "gunicorn --workers 2 --timeout 180"
  frontend: "Volto SSR :3000"

# --- Riesgos ordenados por impacto bajo carga -------------------------------
riesgos_criticos:
  - id: E.0
    titulo: "threads=2 en waitress con endpoint LLM síncrono de 120s"
    evidencia: "/app/etc/zope.ini:9 + api/assistant_chat.py:44,123"
    impacto: "2 usuarios concurrentes en el chat dejan TODO Plone sin servir"
    severidad: critica
  - id: G.1
    titulo: "@messaging-webhook permite escritura anónima sin auth efectiva"
    evidencia: "api/configure.zcml:15-21 (zope2.View) + messaging_webhook.py:29-35"
    impacto: "HMAC opcional y vacío por defecto: cualquiera crea contenido ZODB y encola tareas LLM"
    severidad: critica
  - id: F.1
    titulo: "Ollama (5.5-6.5 GB) no cabe en el VPS objetivo"
    evidencia: "volumen medido 4.8 GB; CX32 = 8 GB total"
    impacto: "OOM garantizado; sin mem_limit se lleva por delante los otros proyectos del VPS"
    severidad: critica
  - id: E.4
    titulo: "Deadlock potencial Plone -> assistant -> Plone (@assistant-search)"
    evidencia: "assistant_chat.py:123 + docker-compose.dev.yml:320"
    impacto: "con threads=2, ambos hilos pueden bloquearse mutuamente hasta timeout"
    severidad: alta
  - id: E.7
    titulo: "Sin pool de conexiones a Postgres"
    evidencia: "embedding_store.py:234-237 y :67-70 (psycopg2.connect por llamada)"
    impacto: "~35-40 conexiones en reposo; max_connections compartido con otros proyectos"
    severidad: alta
  - id: E.9
    titulo: "Race en replace_document (DELETE+INSERT sin lock)"
    evidencia: "embedding_store.py:287-317, UNIQUE en :266"
    impacto: "dos index_content concurrentes -> UniqueViolation -> tarea muere sin retry"
    severidad: media
  - id: E.8
    titulo: "_check_and_mark_sent reenvía ante fallo transitorio"
    evidencia: "tasks/scheduled.py:219-221 (except -> return False)"
    impacto: "docstring dice at-most-once; el código es at-least-once. Mensaje duplicado al huésped"
    severidad: media
  - id: E.5
    titulo: "max_retries declarado pero self.retry() nunca se llama"
    evidencia: "tasks/pipeline.py:31,79"
    impacto: "no hay retry storm: hay pérdida silenciosa de mensajes"
    severidad: media

